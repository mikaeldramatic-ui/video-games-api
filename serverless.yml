org: mikaeldramatic
service: video-game-api

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${file(./config.yml):role}
  environment:
    JWT_SECRET: ${file(./config.yml):jwtSecret}  

functions:
  getGames:
    handler: functions/games/getGames/index.handler
    events:
      - httpApi:
          path: /games
          method: GET
  getGame:
    handler: functions/games/getGame/index.handler
    events:
      - httpApi:
          path: /games/{id}
          method: GET
  createGame:
    handler: functions/games/createGame/index.handler
    events:
      - httpApi:
          path: /games
          method: POST
  deleteGame:
    handler: functions/games/deleteGame/index.handler
    events:
      - httpApi:
          path: /games/{id}
          method: DELETE
  updateGame:
    handler: functions/games/updateGame/index.handler
    events:
      - httpApi:
          path: /games/{id}
          method: PUT
  patchGame:
    handler: functions/games/patchGame/index.handler
    events:
      - httpApi:
          path: /games/{id}
          method: PATCH
  getFranchise:
    handler: functions/franchises/getFranchise/index.handler
    events:
      - httpApi:
          path: /franchises/{franchiseId}
          method: GET
  getFranchiseGames:
    handler: functions/franchises/getFranchiseGames/index.handler
    events:
      - httpApi:
          path: /franchises/{franchiseId}/games
          method: GET
  getFranchiseContent:
    handler: functions/franchises/getFranchiseContent/index.handler
    events:
      - httpApi:
          path: /franchises/{franchiseId}/content
          method: GET
  createFranchiseGame:
    handler: functions/franchises/createFranchiseGame/index.handler
    events:
      - httpApi:
          path: /franchises/{franchiseId}/games
          method: POST
  deleteFranchiseGame:
    handler: functions/franchises/deleteFranchiseGame/index.handler
    events:
      - httpApi:
          path: /franchises/{franchiseId}/games/{gameId}
          method: DELETE
  patchFranchiseGame:
    handler: functions/franchises/patchFranchiseGame/index.handler
    events:
      - httpApi:
          path: /franchises/{franchiseId}/games/{gameId}
          method: PATCH
  createFranchise:
    handler: functions/franchises/createFranchise/index.handler
    events:
      - httpApi:
          path: /franchises
          method: POST
  register:
    handler: functions/auth/register/index.handler
    events:
      - httpApi:
          path: /register
          method: POST
  login:
    handler: functions/auth/login/index.handler
    events:
      - httpApi:
          path: /login
          method: POST                
