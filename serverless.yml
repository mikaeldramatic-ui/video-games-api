org: mikaeldramatic
service: video-game-api

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${file(./config.yml):role}

functions:
  getGames:
    handler: functions/getGames/index.handler
    events:
      - httpApi:
          path: /games
          method: GET
  getGame:
    handler: functions/getGame/index.handler
    events:
      - httpApi:
          path: /games/{id}
          method: GET
  createGame:
    handler: functions/createGame/index.handler
    events:
      - httpApi:
          path: /games
          method: POST
  deleteGame:
    handler: functions/deleteGame/index.handler
    events:
      - httpApi:
          path: /games/{id}
          method: DELETE
  updateGame:
    handler: functions/updateGame/index.handler
    events:
      - httpApi:
          path: /games/{id}
          method: PUT
  patchGame:
    handler: functions/patchGame/index.handler
    events:
      - httpApi:
          path: /games/{id}
          method: PATCH
  getFranchise:
    handler: functions/getFranchise/index.handler
    events:
      - httpApi:
          path: /franchises/{franchiseId}
          method: GET
  getFranchiseGames:
    handler: functions/getFranchiseGames/index.handler
    events:
      - httpApi:
          path: /franchises/{franchiseId}/games
          method: GET
  getFranchiseContent:
    handler: functions/getFranchiseContent/index.handler
    events:
      - httpApi:
          path: /franchises/{franchiseId}/content
          method: GET
  createFranchiseGame:
    handler: functions/createFranchiseGame/index.handler
    events:
      - httpApi:
          path: /franchises/{franchiseId}/games
          method: POST
  deleteFranchiseGame:
    handler: functions/deleteFranchiseGame/index.handler
    events:
      - httpApi:
          path: /franchises/{franchiseId}/games/{gameId}
          method: DELETE
